<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Formulario de Amortización</title>
</head>
<body>
    <center>
        <h2>Tabla de Amortización</h2>
        <div class="card mx-auto" style="max-width:480px;">
        <div class="card-body">
        <form>
            <div class="mb-3">
                <label for="edad" class="form-label">Edad:</label>
                <input type="number" id="edad" name="edad" class="form-control" placeholder="Ingresa tu edad">
            </div>

            <div class="mb-3">
                <label for="pais" class="form-label">País de nacimiento:</label>
                <input type="text" id="pais" name="pais" class="form-control"placeholder="Ingresa tu país de nacimiento">
            </div>

            <div class="mb-3">
                <label for="ingresos" class="form-label">Ingresos mensuales:</label>
                <input type="number" id="ingresos" name="ingresos" class="form-control"placeholder="Ingresa el monto mensual">
            </div>

            <div class="mb-3">
                <label for="buro" class="form-label">Buró de crédito:</label>
                <input type="text" id="buro" name="buro" placeholder="Bueno, regular, malo" class="form-control">
            </div>

            <div class="mb-3 text-center">
                <label for="score" class="form-label">Score:</label>
                <input type="range" id="score" name="score" min="400" max="600" class="form-range mx-auto d-block w-75">
                <!-- Mostrar el valor actual del score -->
                <span id="scoreValue" class="d-block fw-bold mt-2">600</span>
            </div>

            <div class="mb-3">
                <label for="monto" class="form-label">Monto del préstamo:</label>
                <input type="number" id="monto" name="monto" class="form-control"placeholder="Ingresa el monto del préstamo">
            </div>

            <div class="mb-3 text-center">
                <label for="meses" class="form-label">Número de meses:</label>
                <!-- Slider que avanza de 12 en 12 meses -->
                <input type="range" id="meses" name="meses" min="12" max="120" step="12" class="form-range mx-auto d-block w-75"placeholder="Ingresa el número de meses">
                <span id="mesesValue" class="d-block fw-bold mt-2">12</span>
            </div>

            <div class="mb-3">
                <label for="tasaRef" class="form-label">Tasa de interés referencia:</label>
                <input type="number" step="0.01" id="tasaRef" name="tasaRef" class="form-control"placeholder="Ingresa el interes">
            </div>

            <div class="mb-3">
                <label for="tasaAnual" class="form-label">Tasa de interés anual:</label>
                <input type="number" step="0.01" id="tasaAnual" name="tasaAnual" class="form-control"placeholder="Ingresa la tasa anual">
            </div>

            <input type="submit" value="Calcular" class="btn btn-primary w-100">
            </form>
        </div>
        </div>
    </center>
    <script>
        // Mostrar el valor del slider score debajo del control
        const scoreInput = document.getElementById('score');
        const scoreDisplay = document.getElementById('scoreValue');

        function updateScore() {
            scoreDisplay.textContent = scoreInput.value;
        }

        // valor inicial
        updateScore();
        scoreInput.addEventListener('input', updateScore);

        // Clasificación de score: escribe la clasificación dentro del campo 'buro' y aplica color
        const buroInput = document.getElementById('buro');
        function updateScoreClassification() {
            const v = Number(scoreInput.value);
            let status = '';
            let borderClass = '';
            let textClass = '';
            if (v >= 550) { status = 'Bueno'; borderClass = 'border-success'; textClass = 'text-success'; }
            else if (v >= 450) { status = 'Regular'; borderClass = 'border-warning'; textClass = 'text-warning'; }
            else { status = 'Malo'; borderClass = 'border-danger'; textClass = 'text-danger'; }

            // poner valor en el input y aplicar clases de Bootstrap
            buroInput.value = status;
            buroInput.classList.remove('border-success','border-warning','border-danger','text-success','text-warning','text-danger');
            buroInput.classList.add(borderClass, textClass);
        }

        // inicial y enlace de eventos
        updateScoreClassification();
        scoreInput.addEventListener('input', updateScoreClassification);

        // Slider para 'meses' con pasos de 12 meses
        const mesesInput = document.getElementById('meses');
        const mesesDisplay = document.getElementById('mesesValue');

        function updateMeses() {
            mesesDisplay.textContent = mesesInput.value;
        }

        // valor inicial
        updateMeses();
        mesesInput.addEventListener('input', updateMeses);
    </script>
</body>
</html>
